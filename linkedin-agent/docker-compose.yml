version: "3.9"

services:
  backend:
    build: ./backend
    container_name: linkedin_agent_backend
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI}
      - APP_BASE_URL=${APP_BASE_URL}
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: linkedin_agent_frontend
    env_file:
      - ./.env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${APP_BASE_URL}/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: npm run dev

  postgres:
    image: postgres:15
    container_name: linkedin_agent_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: linkedin_agent_redis
    ports:
      - "6379:6379"

volumes:
  pgdata: