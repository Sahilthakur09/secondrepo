version: "3.9"

services:
  backend:
    build: ./apps/backend
    env_file: ./.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build: ./apps/backend
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info
    env_file: ./.env
    depends_on:
      - backend
      - redis

  beat:
    build: ./apps/backend
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info
    env_file: ./.env
    depends_on:
      - worker

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-influenceos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-influenceos}
      POSTGRES_DB: ${POSTGRES_DB:-influenceos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"
    env_file: ./.env
    depends_on:
      - backend

volumes:
  pgdata: